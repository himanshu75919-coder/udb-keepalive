name: Render Keep-Alive

# Ye workflow dono Render services ko har 5 min me bahar se ping karta hai
# (Render free instance 15 min inactivity par so jata hai -> 50 sec cold start).
# Koi secret nahi hai isme - sirf public URLs.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping bot + API hub
        run: |
          fail=0
          for U in "https://utility-duniya-bot.onrender.com/ping" "https://utility-api-vu83.onrender.com/health"; do
            code=$(curl -s -o /dev/null -m 90 -w '%{http_code}' "$U" || echo 000)
            echo "$(date -u +%H:%M:%S) $U -> HTTP $code"
            if [ "$code" != "200" ]; then fail=$((fail+1)); fi
          done
          echo "done (non-200: $fail)"
      - name: Weekly heartbeat (GitHub 60-din schedule disable se bachao)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            content=$(date -u | base64 -w0)
            repo="${{ github.repository }}"
            sha=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/contents/HEARTBEAT.txt" | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
            if [ -n "$sha" ]; then
              body="{\"message\":\"heartbeat\",\"content\":\"$content\",\"sha\":\"$sha\"}"
            else
              body="{\"message\":\"heartbeat\",\"content\":\"$content\"}"
            fi
            curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              "https://api.github.com/repos/$repo/contents/HEARTBEAT.txt" -d "$body" -o /dev/null -w "heartbeat: %{http_code}\n"
          fi
