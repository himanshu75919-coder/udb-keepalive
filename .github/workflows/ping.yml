name: keepalive-ping
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot + hub
        run: |
          curl -fsS --max-time 30 https://utility-duniya-bot.onrender.com/ping || true
          curl -fsS --max-time 30 https://utility-api-vu83.onrender.com/health || true
